[project]
name = "dotman"
version = "0.7.0"
authors = [
  { name="Aditya Pratap Singh Rathore"},
]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
dotman = "dotman.__cli__:app"


[tool.hatch.build.targets.wheel]
packages = ["src/dotman"]

[tool.coverage.run]
omit = [
    "src/dotman/errors/*",
    "tests/*",

    # TODO: Re-enable CLI coverage once dedicated CLI integration tests are added.
    # CLI wrappers (temporary)
    "src/dotman/cli/app/*",
    "src/dotman/cli/profile/*",
    "src/dotman/cli/config/*",
]

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
]


[tool.typer]
main = "dotman.__cli__:app"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.54",
]
