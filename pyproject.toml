[project]
name = "dotman"
version = "0.6.2"
authors = [
  { name="Aditya Pratap Singh Rathore"},
]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotman"]


[project.scripts]
dotman = "dotman.__cli__:app"

[tool.coverage.run]
omit = [
    "src/dotman/cli/*",
]

[tool.typer]
main = "dotman.__cli__:app"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]
