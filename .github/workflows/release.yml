name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: dotman-linux-x86_64

          - os: ubuntu-24.04-arm
            binary: dotman-linux-arm64

          - os: macos-13
            binary: dotman-darwin-x86_64

          - os: macos-latest
            binary: dotman-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment and dependencies
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Build binary
        run: |
          uv run pyinstaller \
            --name "${{ matrix.binary }}" \
            --onefile \
            --hidden-import=shellingham.posix \
            src/dotman/__cli__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        working-directory: binaries
        run: |
          set -euo pipefail
          
          shopt -s nullglob
          binaries=(dotman-*)
          
          # Guard clause: Ensure exactly 4 binaries were downloaded
          if (( ${#binaries[@]} != 4 )); then
            echo "Error: Expected 4 binaries, found ${#binaries[@]}" >&2
            printf '%s\n' "${binaries[@]}"
            exit 1
          fi
          
          sha256sum "${binaries[@]}" > checksums.sha256
          
          echo "Release files:"
          ls -lh
          
          echo
          echo "Checksums:"
          cat checksums.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            binaries/dotman-*
            binaries/checksums.sha256