<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" width="100%" height="100%">
  <defs>
    <!-- Use System Fonts to bypass VS Code Content Security Policies -->
    <style>
      .text-title {
        font-family: 'Impact', 'Futura-Bold', 'Arial Black', system-ui, sans-serif;
        font-weight: 900;
        font-size: 104px;
        fill: #ffffff;
        letter-spacing: 2px; 
        text-transform: uppercase;
      }
      .text-subtitle {
        font-family: 'Courier New', 'Courier', monospace;
        font-weight: bold;
        font-size: 21px;
        fill: #a6adc8;
        letter-spacing: 1px;
      }
      /* Dynamic Theme Support for GitHub Light Mode */
      @media (prefers-color-scheme: light) {
        .text-title { fill: #11111b; }
        .text-subtitle { fill: #6c7086; }
        #matrix-core circle, #matrix-code circle, #matrix-config circle { fill: #f5f5f7; }
      }
    </style>

    <!-- Vibrant Glow Effects matching original structural filter definitions -->
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-teal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node Blueprint 1: Central Sync Hub (Blue) -->
    <g id="matrix-core">
      <circle cx="0" cy="0" r="22" fill="#1e1e2e" stroke="#89b4fa" stroke-width="3"/>
      <polygon points="0,-7 6,4 -6,4" fill="#89b4fa" />
    </g>

    <!-- Node Blueprint 2: Script / Code Dot (Purple) -->
    <g id="matrix-code">
      <circle cx="0" cy="0" r="16" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2.5"/>
      <path d="M -4 -4 L -7 0 L -4 4 M 4 -4 L 7 0 L 4 4" fill="none" stroke="#b4befe" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Node Blueprint 3: Configuration File Dot (Teal) -->
    <g id="matrix-config">
      <circle cx="0" cy="0" r="16" fill="#1e1e2e" stroke="#94e2d5" stroke-width="2.5"/>
      <path d="M -3 -5 L 1 -5 L 4 -2 L 4 5 L -3 5 Z" fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ================= LOGO ICON ================= -->
  <g transform="translate(10, 0)">
    <!-- Structural Connection Grid (Isometric Matrix Wires) -->
    <g stroke="#45475a" stroke-width="2" stroke-dasharray="4 4">
      <line x1="110" y1="30" x2="50" y2="65" />
      <line x1="110" y1="30" x2="170" y2="65" />
      <line x1="50" y1="65" x2="50" y2="125" />
      <line x1="170" y1="65" x2="170" y2="125" />
      <line x1="50" y1="125" x2="110" y2="160" />
      <line x1="170" y1="125" x2="110" y2="160" />
      <line x1="110" y1="30" x2="110" y2="95" />
      <line x1="50" y1="65" x2="110" y2="95" />
      <line x1="170" y1="65" x2="110" y2="95" />
      <line x1="110" y1="160" x2="110" y2="95" />
    </g>

    <!-- Outer Ambient Node Orbs -->
    <circle cx="110" cy="30" r="4" fill="#cba6f7" />
    <circle cx="110" cy="160" r="4" fill="#b4befe" />

    <!-- Isometric Matrix Placements matching original structural patterns -->
    <use href="#matrix-code" x="50" y="65" filter="url(#glow-purple)" />
    <use href="#matrix-code" x="170" y="65" filter="url(#glow-purple)" />

    <use href="#matrix-core" x="110" y="95" filter="url(#glow-blue)" />

    <use href="#matrix-config" x="50" y="125" filter="url(#glow-teal)" />
    <use href="#matrix-config" x="170" y="125" filter="url(#glow-teal)" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(245, 104)">
    <text x="0" y="0" class="text-title">dotman</text>
    <text x="4" y="44" class="text-subtitle">clean &amp; intuitive dotfile manager</text>
  </g>
</svg>
